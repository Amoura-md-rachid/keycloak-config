name: Spring Boot CI/CD Pipeline v2 # Workflow CI/CD pour builder, tester, dockeriser et déployer une app Spring Boot

# Déclenche le workflow lors d'un push ou d'une pull request sur certaines branches
on:
  push:
    branches: [ main, develop, 'feature/**' ] # Se déclenche sur push vers main, develop ou feature/*
  pull_request:
    branches: [ main, develop ] # Se déclenche sur PR vers main ou develop

jobs:
  build:
    runs-on: ubuntu-latest # Utilise un runner Ubuntu GitHub pour exécuter le job

    steps:
      - uses: actions/checkout@v4 # Clone le dépôt GitHub

      - name: Set up JDK 21
        uses: actions/setup-java@v4 # Installe Java 21 (Temurin)
        with:
          java-version: '21' # Version de Java à installer
          distribution: 'temurin' # Distribution Java

      - name: Cache Maven packages
        uses: actions/cache@v3 # Met en cache le dossier .m2 pour accélérer les builds
        with:
          path: ~/.m2 # Dossier à mettre en cache
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }} # Clé de cache unique selon OS et pom.xml
          restore-keys: ${{ runner.os }}-m2 # Clé de secours si cache non trouvé

      - name: Build with Maven
        run: mvn clean package # Compile le projet et génère le package JAR

      - name: Run tests
        run: mvn test # Lance les tests unitaires Maven

      - name: Build Docker image
        run: docker build -t my-spring-app . # Construit l'image Docker à partir du Dockerfile

      - name: Login to Docker Hub
        uses: docker/login-action@v3 # Se connecte à Docker Hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # Nom d'utilisateur Docker Hub (secret)
          password: ${{ secrets.DOCKERHUB_TOKEN }} # Token Docker Hub (secret)

      - name: Push to Docker Hub
        run: |
          docker tag my-spring-app ${{ secrets.DOCKERHUB_USERNAME }}/my-spring-app:${{ github.sha }} # Tag l'image Docker avec le SHA du commit
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-spring-app:${{ github.sha }} # Pousse l'image sur Docker Hub

  deploy:
    needs: build # Attend la fin du job build avant de démarrer
    runs-on: ubuntu-latest # Utilise un runner Ubuntu pour le job de déploiement

    steps:
      - name: Deploy to VPS
        env:
          PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }} # Clé privée SSH pour se connecter à la VPS
          HOST: ${{ secrets.VPS_HOST }}          # Adresse IP ou domaine de la VPS
          USER: root                              # Utilisateur SSH (root)
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }} # Utilisateur Docker Hub
        run: |
          # Écrit la clé privée dans un fichier temporaire et sécurise les permissions
          echo "$PRIVATE_KEY" > private_key
          chmod 600 private_key

          # Vérifie la connectivité SSH sur le port 22
          echo "Test de connexion à $HOST sur le port 22"
          nc -zv $HOST 22 || exit 1

          # Test de connexion SSH avec débogage
          ssh -v -o StrictHostKeyChecking=no -i private_key ${USER}@${HOST} "echo 'Connexion SSH réussie'"

          # Déploiement de l'application Docker sur la VPS
          ssh -o StrictHostKeyChecking=no -i private_key ${USER}@${HOST} "
            sudo docker pull ${DOCKERHUB_USERNAME}/my-spring-app:${{ github.sha }} && # Récupère la nouvelle image depuis Docker Hub
            sudo docker stop my-spring-app || true && # Stoppe l'ancien conteneur si présent
            sudo docker rm my-spring-app || true &&   # Supprime l'ancien conteneur si présent
            sudo docker run -d --name my-spring-app -p 8081:8081 ${DOCKERHUB_USERNAME}/my-spring-app:${{ github.sha }} # Lance le nouveau conteneur
          "

